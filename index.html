<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Presupuesto</title><meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --navy:#0f172a;--navy2:#1e293b;--blue:#2563eb;--blue-light:#eff6ff;--ink:#0f172a;--muted:#64748b;
  --line:#e2e8f0;--surface:#ffffff;--bg:#f8fafc;--green:#10b981;--red:#ef4444;--amber:#f59e0b;
  --radius:16px;--shadow:0 4px 20px -2px rgba(15,23,42,0.06);--shadow-lg:0 10px 30px -4px rgba(15,23,42,0.08)
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
header{background:var(--surface);color:var(--ink);padding:14px max(16px,calc((100vw - 980px)/2));border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);background:rgba(255,255,255,0.92)}
header h1{font-size:1.15rem;letter-spacing:-.03em;margin:0;font-weight:800;color:var(--navy)}
header div{font-size:.76rem;color:var(--muted);margin-top:2px}

main{max-width:980px;margin:0 auto;padding:16px 12px 28px}
.page{display:none;animation:fadeIn .2s ease-out}.page.active{display:block}
@keyframes fadeIn{from{opacity:.5;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}

.page-heading{margin:0 2px 14px}
.page-heading h2{font-size:1.5rem;letter-spacing:-.04em;margin:0;font-weight:800;color:var(--navy)}
.eyebrow{font-size:.65rem;letter-spacing:.12em;font-weight:800;color:var(--blue);margin:0 0 4px;text-transform:uppercase}
.subheading{color:var(--muted);font-size:.82rem;margin:3px 0 0}

.card{background:var(--surface);padding:18px;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);margin:0 0 14px;min-width:0;transition:transform .15s,box-shadow .15s}
.card h2{font-size:.96rem;letter-spacing:-.02em;margin:0 0 12px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px}

.home-grid{display:grid;gap:14px}
.summary-header-card{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;border:0;box-shadow:var(--shadow-lg)}
.summary-header-card h2{color:#fff}
.summary-header-card .stat{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(8px)}
.summary-header-card .stat small{color:#cbd5e1}
.summary-header-card .stat strong{font-size:1.2rem;color:#fff}
.summary-header-card .note{color:#e2e8f0}

/* GRÁFICO DONA */
.chart-container{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0;margin-bottom:12px}
.donut-chart-wrapper{position:relative;width:180px;height:180px}
.donut-chart-wrapper svg{transform:rotate(-90deg);width:100%;height:100%}
.donut-chart-wrapper circle{transition:stroke-dasharray .5s ease,stroke-dashoffset .5s ease}
.chart-center-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.chart-center-text small{display:block;font-size:.68rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em}
.chart-center-text strong{font-size:1.15rem;color:#fff;font-weight:800;line-height:1.2}
.chart-legend{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;margin-top:10px}
.legend-item{font-size:.7rem;text-align:center;padding:6px;background:rgba(255,255,255,0.06);border-radius:8px;border:1px solid rgba(255,255,255,0.08)}
.legend-item span{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

label{display:block;margin:10px 0 4px;color:#475569;font-size:.76rem;font-weight:700}
input,select,button{font:inherit;border-radius:10px;box-sizing:border-box}
input,select{display:block;width:100%;padding:10px 12px;border:1px solid #cbd5e1;background:#fff;color:var(--ink);outline:none;min-width:0;font-size:.88rem;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,0.15)}
button{border:0;cursor:pointer;transition:all .15s;font-size:.85rem;font-weight:700;padding:11px 14px;border-radius:10px}
button:active{transform:scale(.98)}
.card>button:not(.alt){width:100%;background:var(--blue);color:#fff;margin-top:14px;box-shadow:0 2px 8px rgba(37,99,235,0.25)}
.card>button:not(.alt):hover{background:#1d4ed8}
button.alt{background:#f1f5f9;color:var(--navy);border:1px solid #e2e8f0}
button.alt:hover{background:#e2e8f0}
button:disabled{opacity:.45;cursor:not-allowed}

.row,.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row.three{grid-template-columns:1.2fr .8fr 1fr}
.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:#f8fafc;border-radius:12px;padding:12px;border:1px solid #f1f5f9;min-width:0}
.stat small{display:block;color:#64748b;font-size:.7rem;margin-bottom:3px;font-weight:600}
.stat strong{font-size:1.08rem;letter-spacing:-.03em;overflow-wrap:anywhere;color:var(--navy)}
.note{font-size:.76rem;color:var(--muted);line-height:1.45;margin:10px 0 0}
.line{display:flex;justify-content:space-between;gap:8px;margin:12px 0 6px;font-size:.82rem}
.line b{font-variant-numeric:tabular-nums}
.bar{height:7px;background:#e2e8f0;border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s ease}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.78rem;min-width:570px;background:#fff}
td,th{text-align:left;padding:10px 10px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:#64748b;background:#f8fafc;font-weight:700}
tr:last-child td{border-bottom:0}
td button{padding:5px 8px;font-size:.72rem}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.actions button{width:100%;margin:0}
.income-item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9}
.income-item:last-child{border-bottom:0}
.income-item small{display:block;color:var(--muted);font-size:.72rem;margin-top:2px}
.income-item button{width:auto;margin:0;padding:6px 10px}

.compact-tabs{display:flex;gap:6px;padding:4px;margin:0 0 14px;background:#e2e8f0;border-radius:12px;overflow-x:auto;scrollbar-width:none}
.compact-tabs::-webkit-scrollbar{display:none}
.compact-tabs button{flex:1;white-space:nowrap;background:transparent;color:#64748b;padding:8px 12px;border-radius:8px;font-size:.78rem;border:0;font-weight:600}
.compact-tabs button.active{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(15,23,42,0.08);font-weight:800}
.tab-panel-hidden{display:none!important}

.bottom-nav{position:fixed;z-index:30;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:8px max(6px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,0.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);box-shadow:0 -4px 20px rgba(15,23,42,0.05)}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:transparent;color:#64748b;padding:6px 2px;font-size:.65rem;font-weight:700;border-radius:10px;border:0;cursor:pointer}
.nav-item .nav-icon{font-size:1.1rem;line-height:1}
.nav-item.active{background:var(--blue-light);color:var(--blue)}

@media(min-width:700px){
  body{padding-bottom:25px}
  main{padding:22px 20px 32px}
  .home-grid{grid-template-columns:1fr 1fr}
  .home-grid>.summary-header-card{grid-column:1/-1}
  .bottom-nav{position:sticky;top:0;bottom:auto;max-width:720px;margin:0 auto 10px;border:1px solid var(--line);border-radius:0 0 16px 16px;padding:6px;box-shadow:var(--shadow)}
  .nav-item{flex-direction:row;gap:6px;font-size:.78rem;padding:9px}
  .actions{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(max-width:420px){
  main{padding:12px 8px 22px}
  .card{padding:14px;border-radius:14px}
  .page-heading h2{font-size:1.35rem}
  .row.three{grid-template-columns:1fr}
  .compact-tabs button{padding:8px 6px}
}
</style></head><body>

  <h1>Mi Presupuesto</h1>

</header>

        <p class="eyebrow">TU DINERO, MÁS CLARO</p>

      </div>

    <div class="home-grid">

        <!-- Gráfico Estilo Dona -->
        <div class="chart-container">
          <div class="donut-chart-wrapper">

              <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3.8" />
              <path id="chartSpent" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#ef4444" stroke-width="3.8" stroke-dasharray="0, 100" />
              <path id="chartSave" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#3b82f6" stroke-width="3.8" stroke-dasharray="0, 100" />
              <path id="chartLeft" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#10b981" stroke-width="3.8" stroke-dasharray="0, 100" />
            </svg>
            <div class="chart-center-text">
              <small>Disponible</small>
